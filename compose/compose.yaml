# Generic single-application Compose starter.
# Replace build context, ports, and environment values for your application.
services:
  app:
    build:
      context: .
    init: true
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_ENV: production
    # Add a healthcheck only when your app has a reliable health endpoint.
